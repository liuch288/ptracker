[project]
name = "ptracker"
version = "0.1.2"
description = "Personal investment portfolio tracking CLI tool"
authors = [
    {name = "ptracker", email = "ptracker@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tinydb>=4.8.0",
    "filelock>=3.12.0",
    "yfinance>=0.2.0",
    "akshare>=1.12.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "toml>=0.10.0",
]

[project.scripts]
ptracker = "ptracker.cli.main:app"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ptracker*"]
